[project]
name = "ai-interviewer-research"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []
description = "Resumable product engineering research pipeline"
readme = "README.md"

[project.scripts]
product-engineering = "product_engineering.cli:main"
interview-platform = "interview_platform.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["tools/product-research", "prototypes/interview-platform"]
include = ["product_engineering*", "interview_platform*"]
