upstream api { server api:8000; }
upstream cabinet { server cabinet-ui:80; }
upstream candidate { server candidate-ui:80; }

server {
  listen 80;
  client_max_body_size 20m;

  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://napoleonit-career.ru$request_uri; }
}

server {
  listen 443 ssl;
  server_name napoleonit-career.ru;
  client_max_body_size 20m;

  ssl_certificate /etc/letsencrypt/live/napoleonit-career.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/napoleonit-career.ru/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header Strict-Transport-Security "max-age=31536000" always;

  location /api/ { proxy_pass http://api/; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /candidate/ { proxy_pass http://api/candidate/; proxy_request_buffering off; }
  location = /interview { return 302 /interview/?$args; }
  location /interview/ { proxy_pass http://candidate/; }
  location / { proxy_pass http://cabinet/; }
}
