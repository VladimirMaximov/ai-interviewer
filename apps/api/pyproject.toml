[project]
name = "ai-interviewer-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "boto3>=1.35",
    "psycopg[binary]>=3.2",
    "openai>=2.0",
    "pypdf>=5.0",
]

[project.optional-dependencies]
proctoring = [
    "pyannote.audio>=4.0",
    "speechbrain>=1.0",
    "torch>=2.5",
    "torchaudio>=2.5",
]
# GigaAM v3 is currently released from the official repository rather than the
# older PyPI package. Keep it optional: the default developer setup uses
# whisper.cpp and must not download model frameworks unexpectedly.
local-speech = [
    "gigaam[longform] @ git+https://github.com/salute-developers/GigaAM.git@7447938d791c4f3e643386ee22c33777004293a5",
]
workers = [
    "celery[redis]==5.5.3",
    "redis==5.2.1",
]
# GPU models are isolated in the presenter worker image. Keeping its queue
# client here lets the API enqueue work without importing CUDA or model code.
presenter = [
    "celery[redis]==5.5.3",
    "redis==5.2.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.unittest]
start-directory = "tests"
